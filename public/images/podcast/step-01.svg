<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F5EDE0"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb303"/>
      <stop offset="60%" stop-color="#ff9a02"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#ff8800" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="400" fill="url(#bg1)"/>

  <!-- Decorative dots -->
  <circle cx="80" cy="70" r="4" fill="#ff8800" opacity="0.18"/>
  <circle cx="560" cy="340" r="6" fill="#ffb303" opacity="0.18"/>
  <circle cx="580" cy="80" r="3" fill="#ff9a02" opacity="0.3"/>

  <!-- Calendar body -->
  <g filter="url(#shadow1)">
    <rect x="150" y="80" width="340" height="260" rx="22" fill="#ffffff" stroke="#F5EDE0" stroke-width="2"/>

    <!-- Calendar header -->
    <rect x="150" y="80" width="340" height="64" rx="22" fill="url(#orange)"/>
    <rect x="150" y="112" width="340" height="32" fill="url(#orange)"/>

    <!-- Rings -->
    <circle cx="210" cy="80" r="7" fill="#ffffff" stroke="#3D2010" stroke-width="3"/>
    <circle cx="430" cy="80" r="7" fill="#ffffff" stroke="#3D2010" stroke-width="3"/>
    <rect x="207" y="64" width="6" height="24" rx="3" fill="#3D2010"/>
    <rect x="427" y="64" width="6" height="24" rx="3" fill="#3D2010"/>

    <!-- Month label -->
    <text x="320" y="124" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="1">APRIL 2026</text>

    <!-- Day headers -->
    <g font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#9ca3af" letter-spacing="0.5">
      <text x="184" y="172" text-anchor="middle">S</text>
      <text x="229" y="172" text-anchor="middle">M</text>
      <text x="274" y="172" text-anchor="middle">T</text>
      <text x="319" y="172" text-anchor="middle">W</text>
      <text x="364" y="172" text-anchor="middle">T</text>
      <text x="409" y="172" text-anchor="middle">F</text>
      <text x="454" y="172" text-anchor="middle">S</text>
    </g>

    <!-- Day grid -->
    <g font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#6b7280">
      <text x="184" y="202" text-anchor="middle">29</text>
      <text x="229" y="202" text-anchor="middle">30</text>
      <text x="274" y="202" text-anchor="middle">31</text>
      <text x="319" y="202" text-anchor="middle" fill="#111827">1</text>
      <text x="364" y="202" text-anchor="middle" fill="#111827">2</text>
      <text x="409" y="202" text-anchor="middle" fill="#111827">3</text>
      <text x="454" y="202" text-anchor="middle" fill="#111827">4</text>

      <text x="184" y="232" text-anchor="middle" fill="#111827">5</text>
      <text x="229" y="232" text-anchor="middle" fill="#111827">6</text>
      <text x="274" y="232" text-anchor="middle" fill="#111827">7</text>
      <text x="319" y="232" text-anchor="middle" fill="#111827">8</text>
      <text x="364" y="232" text-anchor="middle" fill="#111827">9</text>
      <text x="409" y="232" text-anchor="middle" fill="#111827">10</text>
      <text x="454" y="232" text-anchor="middle" fill="#111827">11</text>

      <text x="184" y="262" text-anchor="middle" fill="#111827">12</text>
      <text x="229" y="262" text-anchor="middle" fill="#111827">13</text>
      <text x="274" y="262" text-anchor="middle" fill="#111827">14</text>
      <text x="319" y="262" text-anchor="middle" fill="#111827">15</text>
      <text x="364" y="262" text-anchor="middle" fill="#111827">16</text>

      <!-- Highlighted day 17 -->
      <circle cx="409" cy="257" r="18" fill="url(#orange)"/>
      <text x="409" y="263" text-anchor="middle" fill="#ffffff" font-weight="800">17</text>

      <text x="454" y="262" text-anchor="middle" fill="#111827">18</text>

      <text x="184" y="292" text-anchor="middle" fill="#111827">19</text>
      <text x="229" y="292" text-anchor="middle" fill="#111827">20</text>
      <text x="274" y="292" text-anchor="middle" fill="#111827">21</text>
      <text x="319" y="292" text-anchor="middle" fill="#111827">22</text>
      <text x="364" y="292" text-anchor="middle" fill="#111827">23</text>
      <text x="409" y="292" text-anchor="middle" fill="#111827">24</text>
      <text x="454" y="292" text-anchor="middle" fill="#111827">25</text>

      <text x="184" y="322" text-anchor="middle" fill="#111827">26</text>
      <text x="229" y="322" text-anchor="middle" fill="#111827">27</text>
      <text x="274" y="322" text-anchor="middle" fill="#111827">28</text>
      <text x="319" y="322" text-anchor="middle" fill="#111827">29</text>
      <text x="364" y="322" text-anchor="middle" fill="#111827">30</text>
    </g>
  </g>
</svg>
