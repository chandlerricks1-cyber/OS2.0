<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F5EDE0"/>
    </linearGradient>
    <linearGradient id="orange2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb303"/>
      <stop offset="60%" stop-color="#ff9a02"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#ff8800" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="url(#bg2)"/>

  <!-- Decorative dots -->
  <circle cx="60" cy="340" r="5" fill="#ffb303" opacity="0.2"/>
  <circle cx="590" cy="60" r="4" fill="#ff8800" opacity="0.22"/>
  <circle cx="560" cy="330" r="3" fill="#ff9a02" opacity="0.3"/>

  <!-- Form card -->
  <g filter="url(#shadow2)">
    <rect x="120" y="50" width="400" height="300" rx="22" fill="#ffffff" stroke="#F5EDE0" stroke-width="2"/>

    <!-- Header bar -->
    <rect x="120" y="50" width="400" height="48" rx="22" fill="url(#orange2)"/>
    <rect x="120" y="80" width="400" height="18" fill="url(#orange2)"/>
    <circle cx="144" cy="74" r="5" fill="#ffffff" opacity="0.45"/>
    <circle cx="162" cy="74" r="5" fill="#ffffff" opacity="0.45"/>
    <circle cx="180" cy="74" r="5" fill="#ffffff" opacity="0.45"/>
    <text x="320" y="80" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing="0.5">BUSINESS INTAKE</text>

    <!-- Step 1: Business Overview (complete) -->
    <g transform="translate(150, 130)">
      <circle cx="18" cy="18" r="18" fill="url(#orange2)"/>
      <path d="M10 18 L16 24 L26 13" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="52" y="16" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111827">Business Overview</text>
      <rect x="52" y="24" width="220" height="8" rx="4" fill="#F5EDE0"/>
      <rect x="52" y="24" width="220" height="8" rx="4" fill="url(#orange2)"/>
    </g>

    <!-- Step 2: Revenue & Metrics (complete) -->
    <g transform="translate(150, 190)">
      <circle cx="18" cy="18" r="18" fill="url(#orange2)"/>
      <path d="M10 18 L16 24 L26 13" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="52" y="16" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111827">Revenue &amp; Money Model</text>
      <rect x="52" y="24" width="220" height="8" rx="4" fill="#F5EDE0"/>
      <rect x="52" y="24" width="180" height="8" rx="4" fill="url(#orange2)"/>
    </g>

    <!-- Step 3: Constraints (in-progress) -->
    <g transform="translate(150, 250)">
      <circle cx="18" cy="18" r="18" fill="#ffffff" stroke="#ff8800" stroke-width="3"/>
      <circle cx="18" cy="18" r="6" fill="url(#orange2)"/>
      <text x="52" y="16" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#111827">Constraints &amp; Goals</text>
      <rect x="52" y="24" width="220" height="8" rx="4" fill="#F5EDE0"/>
      <rect x="52" y="24" width="80" height="8" rx="4" fill="url(#orange2)"/>
    </g>

    <!-- Submit button -->
    <g transform="translate(150, 305)">
      <rect width="220" height="34" rx="17" fill="url(#orange2)"/>
      <text x="110" y="22" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="0.5">SUBMIT QUESTIONNAIRE</text>
    </g>
  </g>
</svg>
