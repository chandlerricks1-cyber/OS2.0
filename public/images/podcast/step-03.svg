<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F5EDE0"/>
    </linearGradient>
    <linearGradient id="orange3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb303"/>
      <stop offset="60%" stop-color="#ff9a02"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>
    <linearGradient id="tile1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2B1A0E"/>
      <stop offset="100%" stop-color="#3D2010"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2b18"/>
      <stop offset="100%" stop-color="#2B1A0E"/>
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#ff8800" flood-opacity="0.2"/>
    </filter>
    <clipPath id="hostClip">
      <circle cx="190" cy="190" r="42"/>
    </clipPath>
  </defs>

  <rect width="640" height="400" fill="url(#bg3)"/>

  <!-- Decorative dots -->
  <circle cx="70" cy="70" r="4" fill="#ff8800" opacity="0.2"/>
  <circle cx="570" cy="340" r="5" fill="#ffb303" opacity="0.22"/>

  <!-- Zoom window -->
  <g filter="url(#shadow3)">
    <rect x="80" y="60" width="480" height="280" rx="20" fill="#1a1208" stroke="#3D2010" stroke-width="2"/>

    <!-- Top bar -->
    <rect x="80" y="60" width="480" height="36" rx="20" fill="#2B1A0E"/>
    <rect x="80" y="82" width="480" height="14" fill="#2B1A0E"/>
    <circle cx="102" cy="78" r="5" fill="#ff6b6b"/>
    <circle cx="120" cy="78" r="5" fill="#ffd447"/>
    <circle cx="138" cy="78" r="5" fill="#5ed27a"/>
    <text x="320" y="82" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" opacity="0.6" letter-spacing="0.5">CRUCIBLE PODCAST · LIVE</text>

    <!-- Tile 1: Host (Chandler) -->
    <g>
      <rect x="104" y="120" width="214" height="160" rx="14" fill="url(#tile1)" stroke="#ff8800" stroke-width="2"/>

      <!-- Avatar circle with initials (fallback styling, image referenced) -->
      <circle cx="211" cy="190" r="44" fill="url(#orange3)"/>
      <image href="/images/podcast/Square%20Headshot%20Italy%20copy.png" x="167" y="146" width="88" height="88" clip-path="url(#hostClip)" preserveAspectRatio="xMidYMid slice"/>
      <circle cx="211" cy="190" r="44" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>

      <!-- Name badge -->
      <rect x="114" y="256" width="130" height="22" rx="6" fill="#000000" opacity="0.55"/>
      <circle cx="126" cy="267" r="4" fill="#5ed27a"/>
      <text x="138" y="271" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Chandler Ricks</text>

      <!-- Mic icon -->
      <g transform="translate(286, 258)">
        <circle cx="10" cy="10" r="12" fill="url(#orange3)"/>
        <rect x="7" y="4" width="6" height="9" rx="3" fill="#ffffff"/>
        <path d="M5 10 Q5 15 10 15 Q15 15 15 10" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <line x1="10" y1="15" x2="10" y2="18" stroke="#ffffff" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Tile 2: Guest (blank) -->
    <g>
      <rect x="322" y="120" width="214" height="160" rx="14" fill="url(#tile2)" stroke="#3D2010" stroke-width="2"/>

      <!-- Blank avatar -->
      <circle cx="429" cy="186" r="44" fill="#3D2010"/>
      <!-- User silhouette -->
      <circle cx="429" cy="176" r="16" fill="#FDF8F3" opacity="0.45"/>
      <path d="M405 220 Q405 200 429 200 Q453 200 453 220 L453 230 L405 230 Z" fill="#FDF8F3" opacity="0.45"/>

      <!-- Name badge -->
      <rect x="332" y="256" width="120" height="22" rx="6" fill="#000000" opacity="0.55"/>
      <circle cx="344" cy="267" r="4" fill="#5ed27a"/>
      <text x="356" y="271" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Your Business</text>

      <!-- Mic icon muted -->
      <g transform="translate(504, 258)">
        <circle cx="10" cy="10" r="12" fill="#3D2010" stroke="#ffffff" stroke-width="1.25" opacity="0.8"/>
        <rect x="7" y="4" width="6" height="9" rx="3" fill="#ffffff" opacity="0.7"/>
        <path d="M5 10 Q5 15 10 15 Q15 15 15 10" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>
      </g>
    </g>

    <!-- Bottom controls bar -->
    <g transform="translate(0, 296)">
      <rect x="200" y="0" width="240" height="36" rx="18" fill="#2B1A0E" stroke="#3D2010" stroke-width="1"/>
      <!-- Mic -->
      <circle cx="232" cy="18" r="11" fill="url(#orange3)"/>
      <rect x="229" y="12" width="6" height="9" rx="3" fill="#ffffff"/>
      <!-- Video -->
      <circle cx="268" cy="18" r="11" fill="url(#orange3)"/>
      <rect x="262" y="13" width="12" height="10" rx="2" fill="#ffffff"/>
      <polygon points="274,15 278,13 278,23 274,21" fill="#ffffff"/>
      <!-- Participants -->
      <circle cx="304" cy="18" r="11" fill="#3D2010"/>
      <circle cx="301" cy="16" r="2.5" fill="#ffffff"/>
      <circle cx="307" cy="16" r="2.5" fill="#ffffff"/>
      <path d="M297 23 Q297 20 301 20 Q305 20 305 23" stroke="#ffffff" stroke-width="1.25" fill="none"/>
      <path d="M303 23 Q303 20 307 20 Q311 20 311 23" stroke="#ffffff" stroke-width="1.25" fill="none"/>
      <!-- End call -->
      <rect x="390" y="8" width="40" height="20" rx="10" fill="#ff4b3a"/>
      <path d="M400 18 Q405 14 410 14 Q415 14 420 18" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
